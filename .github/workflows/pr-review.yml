name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "DIFF_SIZE=$(wc -c < pr.diff)" >> $GITHUB_OUTPUT

      - name: Validate diff size
        run: |
          DIFF_SIZE=${{ steps.diff.outputs.DIFF_SIZE }}
          if [ $DIFF_SIZE -gt 100000 ]; then
            echo "⚠️ Diff is large ($DIFF_SIZE bytes). Review may be limited."
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI review
        id: ai_review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import json

          # Read the diff
          with open('pr.diff', 'r') as f:
              diff_content = f.read()

          # Prepare the review prompt
          review_prompt = f"""You are an expert code reviewer. Analyze this pull request diff and provide a comprehensive review.

## Review Scope
- Code Quality: readability, maintainability, architecture
- Security: vulnerabilities, unsafe practices
- Performance: inefficiencies, optimization opportunities
- Testing: test coverage, edge cases
- Best Practices: language idioms, error handling

## PR Diff
\`\`\`diff
{diff_content}
\`\`\`

## Response Format
Provide inline comments with exact line numbers from the diff. Use this format:

[FILE: path/to/file.py]
- Line N: [SEVERITY] Issue title
  Details and recommendation.

Use severity levels: CRITICAL (blocks merge), HIGH (should fix), MEDIUM (consider), LOW (nice to have).

End with:
✅ Strengths
⚠️ Blockers
💡 Suggestions
📊 Coverage assessment

Be specific, actionable, and concise."""

          # Call OpenRouter API
          api_key = os.getenv('OPENROUTER_API_KEY')
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json',
              'HTTP-Referer': 'https://github.com',
              'X-Title': 'PR Review Bot'
          }

          payload = {
              'model': 'mistralai/mistral-7b-instruct:free',
              'messages': [
                  {'role': 'user', 'content': review_prompt}
              ],
              'max_tokens': 2000
          }

          response = requests.post(
              'https://openrouter.io/api/v1/chat/completions',
              headers=headers,
              json=payload
          )

          if response.status_code != 200:
              print(f"Error: {response.status_code}")
              print(response.text)
              raise Exception(f"OpenRouter API error: {response.text}")

          result = response.json()
          review_text = result['choices'][0]['message']['content']

          # Save review
          with open('ai_review.md', 'w') as f:
              f.write("## 🤖 AI Code Review (OpenRouter)\n\n")
              f.write(review_text)

          print("✅ AI review complete")
          EOF

      - name: Post AI review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '';
            
            try {
              comment = fs.readFileSync('ai_review.md', 'utf8');
            } catch (e) {
              comment = '⚠️ AI review generation failed. Please check the workflow logs.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Summary
        run: |
          echo "## ✨ AI PR Review Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "AI analyzed your pull request and posted feedback as a comment." >> $GITHUB_STEP_SUMMARY
