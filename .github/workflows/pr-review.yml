name: Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Use OpenRouter as OpenAI-compatible API
          USE_GITHUB_MODELS: false
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_ENDPOINT: https://openrouter.ai/api/v1s
          MODEL: mistralai/mistral-7b-instruct:free
          
          # Review settings
          LANGUAGE: English
          PROMPT: "Review this code for quality, security, performance, and best practices. Provide specific line-by-line feedback with severity levels (CRITICAL, HIGH, MEDIUM, LOW)."
          top_p: 0.95
          temperature: 0.7
          max_tokens: 10000
          
          # Ignore patterns
          IGNORE_PATTERNS: /node_modules/**/*,*.md,*.json,*.yml,*.yaml
